    prebuild:
      - test -x "$$SDK$$/cmake/3.22.1/bin/cmake"
      - test -x "$$SDK$$/cmake/3.22.1/bin/ninja"
    build:
      - CRYPTOSTEER_CMAKE_BIN="$$SDK$$/cmake/3.22.1/bin/cmake" CRYPTOSTEER_NINJA_BIN="$$SDK$$/cmake/3.22.1/bin/ninja" ./scripts/build-native-dependencies.sh
      - ./gradlew --no-daemon --no-configuration-cache :app:testDebugUnitTest :app:lintFdroid :app:assembleFdroid
    output: app/build/outputs/apk/fdroid/*.apk
